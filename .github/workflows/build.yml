name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  # ★ 2026-09-28 加 workflow_dispatch。
  #   原因：fork 仓库的 push 事件**不会自动触发** Actions（GitHub 对 fork 的安全策略），
  #   而原 workflow 只声明了 push / pull_request，导致「推上去了但没有任何 run」。
  #   加这一条就能用 `gh workflow run Build` 手动点火。
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ★★ 2026-09-28 换掉原来那行 `actions/setup-android@v3`。
      #   实测报错：Unable to resolve action actions/setup-android, repository not found
      #   —— 「actions」这个 org 下**没有** setup-android 这个 action，
      #   真正的仓库是 `android-actions/setup-android`（org 名不同）。
      #   ★ 用官方 runner 镜像自带的 SDK 更稳：ubuntu-latest 预装了 Android SDK
      #     （ANDROID_HOME 已设好），连装都不用装，也少一个第三方依赖。
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
